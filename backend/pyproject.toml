[project]
name = "pdfbuddy-backend"
version = "1.0.0"
description = "FastAPI backend for PDFBuddy AI-Powered PDF Chat & Document Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "httpx",
  "pydantic",
  "pydantic-settings",
  "python-multipart",
  "pypdf",
  "numpy",
  "pgvector",
  "asyncpg",
  "boto3",
  "python-jose[cryptography]",
  "argon2-cffi",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx[cli]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.uvicorn]
factory = false
host = "0.0.0.0"
port = 8000
